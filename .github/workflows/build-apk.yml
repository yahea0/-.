name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Add Android Native Platform
        run: npx cap add android || true

      - name: Sync Web Code into Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile & Assemble Native Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GravityEcho-Android13-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
